name: kapi up

# Reusable kapi-loop workflow: checkout → setup-kapi → kapi-action → deliver.
# kapi-action reports; THIS workflow owns the delivery step (a PR by default),
# so the composed job stays one include:
#
#   jobs:
#     up:
#       uses: neokapi/kapi-workflows/.github/workflows/up.yml@v1
#       secrets:
#         bowrain-auth-token: ${{ secrets.BOWRAIN_AUTH_TOKEN }}
#       permissions:
#         contents: write
#         pull-requests: write

on:
  workflow_call:
    inputs:
      project:
        description: "Path to the kapi.yaml recipe (-p); empty = git-style upward discovery"
        type: string
        default: ""
      args:
        description: "Extra arguments for kapi up"
        type: string
        default: ""
      create-pull-request:
        description: "Deliver as a branch + PR (default) instead of pushing the current branch"
        type: boolean
        default: true
      fail-on-parked:
        description: "Fail the workflow when the run parks instead of delivering partial progress"
        type: boolean
        default: false
      context-sync:
        description: "kapi-action's context-sync: pull runs kapi context pull before kapi up, and true also runs kapi context push after it, through the backend the project's kapi.yaml declares (kapi 1.3 and later); false skips both"
        type: string
        default: "false"
      plugins:
        description: "Plugin refs for setup-kapi (registry names)"
        type: string
        default: "bowrain"
      kapi-version:
        description: "kapi CLI version for setup-kapi: a release such as 1.2.0, or latest for the newest stable release"
        type: string
        default: "1.2.0"
      server:
        description: "Bowrain server URL (exported as BOWRAIN_SERVER_URL)"
        type: string
        default: ""
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
    secrets:
      bowrain-auth-token:
        description: "Bowrain server JWT (server-connected projects)"
        required: false
      anthropic-api-key:
        description: "Anthropic API key (local-engine runs)"
        required: false
      deliver-token:
        description: >-
          Token for the delivery step. Defaults to the workflow GITHUB_TOKEN,
          whose pushes and PRs trigger NO workflows (GitHub loop prevention) —
          pass a fine-grained PAT or App token when CI or deploys should react
          to the delivered translations.
        required: false
    outputs:
      outcome:
        description: "converged or parked"
        value: ${{ jobs.up.outputs.outcome }}
      passes:
        description: "Reconciliation passes the run took"
        value: ${{ jobs.up.outputs.passes }}
      parked-locales:
        description: "Locales still short of their gate"
        value: ${{ jobs.up.outputs.parked-locales }}
      has-changes:
        description: "Whether the run produced changes"
        value: ${{ jobs.up.outputs.has-changes }}
      pull-request-url:
        description: "URL of the created PR (empty if none)"
        value: ${{ jobs.up.outputs.pull-request-url }}

jobs:
  up:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      outcome: ${{ steps.kapi.outputs.outcome }}
      passes: ${{ steps.kapi.outputs.passes }}
      parked-locales: ${{ steps.kapi.outputs.parked-locales }}
      has-changes: ${{ steps.kapi.outputs.has-changes }}
      pull-request-url: ${{ steps.deliver-pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: neokapi/setup-kapi@v1
        with:
          version: ${{ inputs.kapi-version }}
          plugins: ${{ inputs.plugins }}
          auth-token: ${{ secrets.bowrain-auth-token }}
          server: ${{ inputs.server }}

      - uses: neokapi/kapi-action@v1
        id: kapi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
        with:
          project: ${{ inputs.project }}
          args: ${{ inputs.args }}
          fail-on-parked: ${{ inputs.fail-on-parked }}
          context-sync: ${{ inputs.context-sync }}

      - name: Deliver as a pull request
        id: deliver-pr
        if: steps.kapi.outputs.has-changes == 'true' && inputs.create-pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.deliver-token || github.token }}
          commit-message: "chore: update translations via kapi"
          title: "Translations: kapi up"
          branch: kapi/up
          body: |
            ## kapi up report

            | | |
            |---|---|
            | Outcome | **${{ steps.kapi.outputs.outcome }}** |
            | Passes | ${{ steps.kapi.outputs.passes }} |
            | Parked locales | ${{ steps.kapi.outputs.parked-locales || '—' }} |

            Parked scopes need a person — see the run log for the gate each one is short of.

      - name: Deliver to the current branch
        if: steps.kapi.outputs.has-changes == 'true' && !inputs.create-pull-request
        env:
          DELIVER_TOKEN: ${{ secrets.deliver-token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update translations via kapi"
          if [ -n "$DELIVER_TOKEN" ]; then
            git push "https://x-access-token:${DELIVER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD
          else
            git push
          fi
